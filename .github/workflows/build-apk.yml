name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs a real Gradle on PATH so the wrapper can be regenerated
      # if the project's gradlew / wrapper jar is missing or empty.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
          cache-disabled: true

      # The action's default package list is "tools platform-tools".
      # 'tools' no longer exists, so override with packages that do.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept licenses and install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # npm ci fails if package-lock.json is out of sync with package.json.
      # Try it first (fast, reproducible); fall back to npm install.
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund || {
            echo "npm ci failed (lock file out of sync), falling back to npm install"
            npm install --no-audit --no-fund
          }

      - name: Ensure Capacitor is installed
        run: |
          for pkg in @capacitor/core @capacitor/cli @capacitor/android; do
            if [ ! -d "node_modules/$pkg" ]; then
              echo "Missing $pkg, installing"
              npm install --no-audit --no-fund "$pkg"
            fi
          done
          # The Capacitor CLI needs TypeScript 5.x to read capacitor.config.ts.
          npm install --no-save --no-audit --no-fund typescript@5
          npx cap --version

      # Capacitor 7+ needs JDK 21; older versions work with 17.
      - name: Detect Capacitor version
        id: cap
        run: |
          MAJOR=$(node -p "require('./node_modules/@capacitor/android/package.json').version.split('.')[0]")
          echo "Capacitor Android major version: $MAJOR"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21 (Capacitor 7+)
        if: steps.cap.outputs.major >= 7
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web assets
        run: npm run build --if-present

      # Finds the web output folder, creates capacitor config and the
      # android project only if they are missing.
      - name: Prepare Capacitor project
        run: |
          WEBDIR=""
          for d in dist build www public out; do
            if [ -f "$d/index.html" ]; then WEBDIR="$d"; break; fi
          done
          if [ -z "$WEBDIR" ] && [ -f index.html ]; then
            echo "No build folder found, packaging root index.html into www/"
            mkdir -p www
            cp index.html www/
            for item in assets css js img images fonts icons static; do
              [ -e "$item" ] && cp -r "$item" www/ || true
            done
            WEBDIR="www"
          fi
          echo "Web dir: ${WEBDIR:-<none>}"

          if ! ls capacitor.config.* > /dev/null 2>&1; then
            [ -n "$WEBDIR" ] || { echo "::error::No web build output found (no index.html)"; exit 1; }
            echo "No capacitor config found, creating one"
            cat > capacitor.config.json <<JSON
          {
            "appId": "com.argon.app",
            "appName": "By-Argon",
            "webDir": "$WEBDIR"
          }
          JSON
          fi

          if [ ! -d android ]; then
            echo "No android folder, adding platform"
            npx cap add android
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Show Android project layout
        run: |
          echo "--- android/ ---"
          ls -la android || true
          echo "--- gradlew size / wrapper ---"
          wc -c android/gradlew || true
          ls -la android/gradle/wrapper || true
          echo "--- settings.gradle ---"
          cat android/settings.gradle* 2>/dev/null || true

      # 1) Repairs the Gradle wrapper if it is missing/empty.
      # 2) Builds :app:assembleDebug (falls back to assembleDebug).
      # 3) If no APK appears, regenerates the android project from scratch
      #    with `cap add android` and builds again.
      - name: Build debug APK
        run: |
          set -o pipefail

          fix_wrapper() {
            if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] \
               || [ ! -s android/gradlew ] \
               || ! grep -q "GradleWrapperMain" android/gradlew; then
              echo "Gradle wrapper missing or invalid, regenerating it"
              rm -rf /tmp/gw && mkdir -p /tmp/gw
              (cd /tmp/gw && gradle wrapper --gradle-version 8.11.1 --no-daemon)
              mkdir -p android/gradle
              cp -r /tmp/gw/gradle/. android/gradle/
              cp /tmp/gw/gradlew /tmp/gw/gradlew.bat android/
            fi
            chmod +x android/gradlew
          }

          have_apk() {
            [ -n "$(find android -name '*.apk' -type f 2>/dev/null)" ]
          }

          build() {
            fix_wrapper
            (cd android && ./gradlew --version)
            (cd android && ./gradlew :app:assembleDebug --stacktrace --no-daemon --no-build-cache --console=plain) \
              || (cd android && ./gradlew assembleDebug --stacktrace --no-daemon --no-build-cache --console=plain)
          }

          build || echo "First build attempt failed"

          if ! have_apk; then
            echo "::warning::No APK produced. Regenerating the android project from scratch."
            rm -rf android
            npx cap add android
            npx cap sync android
            build
          fi

          have_apk

      # Searches the whole workspace (Gradle may use a custom build dir)
      # and copies every APK into one predictable folder.
      - name: Collect APK
        run: |
          mkdir -p apk-out
          i=0
          while IFS= read -r f; do
            i=$((i+1))
            echo "Found APK: $f"
            cp "$f" "apk-out/$(basename "$f" .apk)-$i.apk"
          done < <(find "$GITHUB_WORKSPACE" -name '*.apk' -type f \
                     -not -path '*/node_modules/*' -not -path '*/apk-out/*')
          if [ "$i" -eq 0 ]; then
            echo "::error::Gradle finished but produced no .apk file"
            exit 1
          fi
          ls -la apk-out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apk-out/*.apk
          if-no-files-found: error
